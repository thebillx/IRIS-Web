name: Candidate validation
run-name: Exact-head validation ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Approved 40-character commit SHA
        required: true
        type: string
      target_tree:
        description: Approved 40-character tree SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: candidate-validation-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  exact-head:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_TREE: ${{ inputs.target_tree }}
      APPROVED_TARGET_SHA: 54472f2edd229f34e9383d6c6e004bd1aac592a4
      APPROVED_TARGET_TREE: 581867828af04aa267b06abd4d4434e43c2e7cf1
      TARGET_PARENT_SHA: 0ba1aad68dbcebaf1337c40bf19986e78f4d8e01
      TARGET_PARENT_TREE: 59b49b4670023f58009cd1e7553303299abc51a2
      BASELINE_SHA: 72a1e10e627d2c77c97e480420d330207b45b89a
      BASELINE_TREE: e6d875d7849b580e292bb77cda25050bc98b2160
    steps:
      - name: Validate the approved target
        run: |
          set -euo pipefail
          # Bash 3.2 does not apply errexit to [[ ... ]]; reject explicitly.
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$TARGET_TREE" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$TARGET_SHA" = "$APPROVED_TARGET_SHA"
          test "$TARGET_TREE" = "$APPROVED_TARGET_TREE"

      - name: Check out the No-PID recovery CI validation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/codex/one-iris-rarw-no-pid-recovery-ci-validation
          fetch-depth: 0
          persist-credentials: false

      - name: Detach and verify the exact checkout
        id: source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TARGET_SHA" refs/remotes/origin/codex/one-iris-rarw-no-pid-recovery-ci-validation
          git checkout --detach "$TARGET_SHA"
          actual_sha="$(git rev-parse 'HEAD^{commit}')"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$TARGET_SHA"
          test "$actual_tree" = "$TARGET_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
          git rev-parse --verify 'HEAD^1^{commit}' >/dev/null
          test "$(git rev-parse "$TARGET_SHA^1")" = "$TARGET_PARENT_SHA"
          test "$(git rev-parse "$TARGET_PARENT_SHA^{tree}")" = "$TARGET_PARENT_TREE"
          test "$(git rev-parse "$BASELINE_SHA^{commit}")" = "$BASELINE_SHA"
          test "$(git rev-parse "$BASELINE_SHA^{tree}")" = "$BASELINE_TREE"
          git merge-base --is-ancestor "$BASELINE_SHA" "$TARGET_SHA"
          expected_files="$(printf '%s\n' apps/runtime/macos-safety-helper.py apps/runtime/src/control.ts apps/runtime/src/launchd.test.ts apps/runtime/src/launchd.ts apps/runtime/src/macos-safety.test.ts apps/runtime/src/macos-safety.ts apps/runtime/src/recovery-policy.test.ts apps/runtime/src/recovery-policy.ts | LC_ALL=C sort)"
          actual_files="$(git diff --name-only "$BASELINE_SHA" "$TARGET_SHA" | LC_ALL=C sort)"
          test "$actual_files" = "$expected_files"
          printf 'Validated commit: `%s`\nValidated tree: `%s`\n' "$actual_sha" "$actual_tree" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify canonical Node and pnpm toolchain
        run: |
          set -euo pipefail
          node_info="$(node scripts/node24.mjs --print)"
          canonical_node="$(printf '%s\n' "$node_info" | node -e 'let input = ""; process.stdin.on("data", (chunk) => input += chunk).on("end", () => process.stdout.write(JSON.parse(input).path));')"
          canonical_version="$(printf '%s\n' "$node_info" | node -e 'let input = ""; process.stdin.on("data", (chunk) => input += chunk).on("end", () => process.stdout.write(JSON.parse(input).version));')"
          test "$canonical_version" = "v24.20.0"
          test -x "$canonical_node"
          test "$("$canonical_node" --version)" = "v24.20.0"
          canonical_dir="$(dirname "$canonical_node")"
          pnpm_path="$(command -v pnpm)"
          test -n "$pnpm_path"
          test -x "$pnpm_path"
          test "$("$pnpm_path" --version)" = "10.15.0"
          expected_pnpm="$canonical_dir/pnpm"
          test ! -e "$expected_pnpm" && test ! -L "$expected_pnpm"
          test -w "$canonical_dir"
          (set -o noclobber; {
            printf '#!/bin/bash\nexec '
            printf '%q' "$pnpm_path"
            printf ' "$@"\n'
          } > "$expected_pnpm")
          chmod 755 "$expected_pnpm"
          test -f "$expected_pnpm"
          test ! -L "$expected_pnpm"
          test -x "$expected_pnpm"
          test "$(node scripts/node24.mjs --pnpm --version)" = "10.15.0"

      - name: Run Supervisor failure-stop and KeepAlive regressions
        run: |
          pnpm --filter @iris/runtime exec vitest run \
            src/supervisor-native-control.test.ts \
            src/launchd.test.ts \
            src/recovery-policy.test.ts \
            src/supervisor-startup.test.ts \
            src/supervisor-daemon-exit.test.ts \
            src/supervisor-failure-stop.test.ts \
            src/macos-safety.test.ts \
            src/lifecycle-grant.test.ts \
            --testTimeout=30000

      - name: Run Supervisor and repository authority regressions
        run: |
          pnpm --filter @iris/runtime exec vitest run \
            src/supervisor.test.ts \
            src/repository-reconcile.test.ts \
            src/registry-authority-reconcile.test.ts \
            src/capability-service.test.ts \
            src/server.test.ts \
            --testTimeout=180000

      - name: Run Acceptance blocker Runtime integration regressions
        run: |
          pnpm --filter @iris/runtime exec vitest run \
            src/blocker-gateway.integration.test.ts \
            src/blocker-login.integration.test.ts \
            src/blocker-runtime.integration.test.ts \
            src/blocker-mutation-authority.test.ts \
            src/durable-session.test.ts \
            src/job-admission.test.ts \
            src/lifecycle.integration.test.ts \
            src/phase1-identity.test.ts \
            src/phase8-catalog-compat.test.ts \
            --testTimeout=180000

      - name: Run project isolation regressions
        run: |
          pnpm --filter @iris/runtime exec vitest run --testTimeout 30000 \
            src/activation-controller.test.ts \
            src/durable-mission-service.test.ts \
            src/phase2-foundation.test.ts

      - name: Run security and redaction regressions
        run: |
          pnpm --filter @iris/runtime exec vitest run --testTimeout 30000 \
            src/phase55-security-acceptance.test.ts \
            src/phase3-shell-jobs.test.ts \
            src/phase7-security-acceptance.test.ts \
            src/phase7-external-integration.test.ts \
            src/multi-worker/observability.test.ts \
            src/multi-worker/security-acceptance.test.ts
          pnpm --filter @iris/runtime exec tsx -e '
            import { redactOutput, StreamingRedactor } from "./src/output-redaction.ts";
            const secret = "SYNTHETIC_REDACTION_MARKER_4b9c6a8f";
            const stream = new StreamingRedactor([secret]);
            const output = [
              redactOutput(`Authorization: Bearer ${secret}`, [secret]),
              redactOutput(`API_TOKEN=${secret}`, [secret]),
              stream.push(`prefix ${secret.slice(0, 12)}`) + stream.push(`${secret.slice(12)} suffix`) + stream.finish(),
            ].join("\n");
            if (output.includes(secret)) throw new Error("Synthetic redaction marker leaked");
          '

      - name: Run production safety wiring, M74 and CLI regressions
        run: pnpm --filter @iris/runtime exec tsx --test src/production-safety-wiring.test.ts src/production-safety-m74.test.ts src/production-safety-cli.test.ts

      - name: Run typed initial-install setup regressions
        run: pnpm --filter @iris/runtime exec tsx --test src/control-setup.test.ts

      - name: Typecheck and build the workspace
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.20.0"
          test "$(pnpm --version)" = "10.15.0"
          node scripts/node24.mjs scripts/mobile-contract.mjs typecheck
          pnpm --recursive --if-present typecheck
          pnpm --recursive --if-present build

      - name: Check the target diff and lint changed sources
        run: |
          set -euo pipefail
          git diff --check "$BASELINE_SHA" "$TARGET_SHA"
          changed_sources=()
          while IFS= read -r file; do
            [ -n "$file" ] && changed_sources+=("$file")
          done < <(git diff --name-only --diff-filter=ACMR "$BASELINE_SHA" "$TARGET_SHA" -- '*.js' '*.mjs' '*.ts' '*.tsx')
          test "${#changed_sources[@]}" -gt 0
          pnpm exec eslint "${changed_sources[@]}"

      - name: Run unified MCP workload routing regression
        run: pnpm --filter @iris/runtime exec vitest run src/mcp.test.ts src/mcp-v21.test.ts --testTimeout=60000

      - name: Run unified setup and durable mutation regressions
        run: |
          pnpm --filter @iris/runtime exec vitest run \
            src/connector-registry.test.ts \
            src/durable-mutation-journal.test.ts \
            src/phase4-git-worktree.test.ts \
            --testTimeout=180000

      - name: Run Web Owner controls and routing regressions
        run: pnpm --filter @iris/web exec vitest run src --testTimeout=60000
