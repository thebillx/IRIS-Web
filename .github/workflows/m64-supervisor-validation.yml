name: M64 isolated Supervisor validation
on:
  push:
    branches: [codex/m64-supervisor-isolated-validation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: parent
            sha: 0b2c2723736701ca69ac52967029012ec090c840
            tree: 4e99f42ba6f46eded3a9d7f4d596a2a17450ab3e
          - role: candidate
            sha: f1ea872d317ddddcba736f122e53eb9467997fcf
            tree: 0bab894b10f68ee46a684cbbb03917cc99732760
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: validator
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1dce8053aa6fcd52b2766b6b96538bea5f202409
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Restore exact frozen revisions from the reviewed incremental bundle
        env:
          TARGET_SHA: ${{ matrix.sha }}
          TARGET_TREE: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          echo 'e46f71604c870e759765e554274f9e6c436eb3dd91e221af2e276232adcc4ddf  validator/.github/scripts/m64/frozen-delta.bundle' | shasum -a 256 -c -
          git -C source bundle verify ../validator/.github/scripts/m64/frozen-delta.bundle
          git -C source fetch ../validator/.github/scripts/m64/frozen-delta.bundle refs/heads/codex/delegation-acceptance-closure
          git -C source checkout --detach "$TARGET_SHA"
          test "$(git -C source rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
          package_json_file: source/package.json
      - name: Prove environment and validate exact revision
        env:
          TARGET_SHA: ${{ matrix.sha }}
          TARGET_TREE: ${{ matrix.tree }}
          VALIDATION_ROLE: ${{ matrix.role }}
        run: node validator/.github/scripts/m64/validate.mjs
      - name: Preserve bounded validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m64-${{ matrix.role }}
          path: ${{ runner.temp }}/m64-evidence-${{ matrix.role }}/
          if-no-files-found: error
          retention-days: 14
