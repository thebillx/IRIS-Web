name: R10 hosted disposable proof
run-name: R10 exact-source proof ${{ github.sha }}

on:
  push:
    branches:
      - codex/r10-product-recovery-v6
    paths:
      - .github/workflows/r09-hosted-disposable-proof.yml
      - apps/runtime/src/lifecycle.ts
      - apps/runtime/src/lifecycle.recovery.test.ts

permissions:
  contents: read

concurrency:
  group: r10-disposable-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  disposable-proof:
    if: >-
      github.repository == 'thebillx/IRIS-Web' &&
      github.ref == 'refs/heads/codex/r10-product-recovery-v6' &&
      github.event_name == 'push' &&
      github.event.deleted == false
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TARGET_SOURCE_SHA: 894ad6935e0b78a87795deeaef857690bef7f6b2
      TARGET_SOURCE_TREE: e41f061f6672664268d94f5cd39da96d9723f702
      TARGET_SOURCE_PARENT_SHA: 938e972039ae9aa1330c7a5e9feadba4313a42c2
      DEE5_SHA: dee5eee8682c9f929e5c41dec00ad76c78d1c5b8
      DEE5_TREE: 22dc3776007fec1243535577834e0c60b7ed3371
      IRIS_AGENT_EXECUTOR: development
    steps:
      - name: Confine job-local paths before checkout or package setup
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/iris-r10"
          mkdir -p "$root"/{home,cache/npm,config,data,state,corepack,pnpm-tool,pnpm-store,tmp,evidence}
          chmod 700 "$root" "$root"/{home,cache,config,data,state,corepack,pnpm-tool,pnpm-store,tmp,evidence}
          {
            printf 'HOME=%s\n' "$root/home"
            printf 'XDG_CACHE_HOME=%s\n' "$root/cache"
            printf 'XDG_CONFIG_HOME=%s\n' "$root/config"
            printf 'XDG_DATA_HOME=%s\n' "$root/data"
            printf 'XDG_STATE_HOME=%s\n' "$root/state"
            printf 'COREPACK_HOME=%s\n' "$root/corepack"
            printf 'PNPM_HOME=%s\n' "$root/pnpm-tool"
            printf 'npm_config_cache=%s\n' "$root/cache/npm"
            printf 'TMPDIR=%s\n' "$root/tmp"
            printf 'IRIS_R10_PNPM_STORE=%s\n' "$root/pnpm-store"
            printf 'IRIS_R10_EVIDENCE_DIR=%s\n' "$root/evidence"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$root/pnpm-tool" >> "$GITHUB_PATH"
          test -d "$root/tmp"
          test -d "$root/evidence"

      - name: Validate the immutable push event
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REPOSITORY" = 'thebillx/IRIS-Web'
          test "$GITHUB_REF" = 'refs/heads/codex/r10-product-recovery-v6'
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$TARGET_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$TARGET_SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]] || exit 1

      - name: Check out the immutable workflow event commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: .r10-event
          fetch-depth: 0
          persist-credentials: false

      - name: Verify workflow commit separately from tested source
        id: workflow-identity
        shell: bash
        working-directory: .r10-event
        run: |
          set -euo pipefail
          workspace="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          checkout="$(pwd -P)"
          case "$checkout/" in "$workspace/"*) ;; *) echo 'Checkout escaped GITHUB_WORKSPACE' >&2; exit 1 ;; esac
          workflow_sha="$(git rev-parse 'HEAD^{commit}')"
          workflow_tree="$(git rev-parse 'HEAD^{tree}')"
          workflow_parent="$(git rev-parse 'HEAD^1^{commit}')"
          test "$workflow_sha" = "$GITHUB_SHA"
          test "$workflow_parent" = "$TARGET_SOURCE_SHA"
          test "$(git rev-parse "$TARGET_SOURCE_SHA^{tree}")" = "$TARGET_SOURCE_TREE"
          workflow_paths="$(git diff --name-only --no-renames "$TARGET_SOURCE_SHA" "$workflow_sha" | LC_ALL=C sort)"
          test "$workflow_paths" = '.github/workflows/r09-hosted-disposable-proof.yml'
          test -z "$(git status --porcelain --untracked-files=no)"
          {
            printf 'R10_WORKFLOW_SHA=%s\n' "$workflow_sha"
            printf 'R10_WORKFLOW_TREE=%s\n' "$workflow_tree"
            printf 'R10_WORKFLOW_PARENT=%s\n' "$workflow_parent"
          } >> "$GITHUB_ENV"
          {
            printf '### Workflow event identity\n\n'
            printf -- '- Event commit: `%s`\n- Tree: `%s`\n- Parent/test-source: `%s`\n' "$workflow_sha" "$workflow_tree" "$workflow_parent"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Detach to and verify the exact test source
        id: source-identity
        shell: bash
        working-directory: .r10-event
        run: |
          set -euo pipefail
          test "$(git rev-parse "$TARGET_SOURCE_SHA^1^{commit}")" = "$TARGET_SOURCE_PARENT_SHA"
          test "$(git rev-parse "$DEE5_SHA^{tree}")" = "$DEE5_TREE"
          test "$(git rev-parse "$TARGET_SOURCE_SHA^{tree}")" = "$TARGET_SOURCE_TREE"
          git checkout --detach "$TARGET_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{commit}')" = "$TARGET_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TARGET_SOURCE_TREE"
          test "$(git rev-parse 'HEAD^1^{commit}')" = "$TARGET_SOURCE_PARENT_SHA"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/r09-hosted-disposable-proof.yml' \
            'apps/runtime/src/launchd.test.ts' \
            'apps/runtime/src/lifecycle.integration.test.ts' \
            'apps/runtime/src/lifecycle.recovery.test.ts' \
            'apps/runtime/src/lifecycle.ts' | LC_ALL=C sort)"
          actual_paths="$(git diff --name-only --no-renames "$DEE5_SHA" "$TARGET_SOURCE_SHA" | LC_ALL=C sort)"
          test "$actual_paths" = "$expected_paths"
          test -z "$(git status --porcelain --untracked-files=no)"
          {
            printf 'R10_SOURCE_SHA=%s\n' "$TARGET_SOURCE_SHA"
            printf 'R10_SOURCE_TREE=%s\n' "$TARGET_SOURCE_TREE"
            printf 'R10_SOURCE_PARENT=%s\n' "$TARGET_SOURCE_PARENT_SHA"
          } >> "$GITHUB_ENV"
          printf '\n### Tested application source\n\n- Source: `%s`\n- Tree: `%s`\n- Parent: `%s`\n- DEE5 delta: exactly the five reviewed paths\n' "$TARGET_SOURCE_SHA" "$TARGET_SOURCE_TREE" "$TARGET_SOURCE_PARENT_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0

      - name: Set up pnpm in runner-local storage
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
          dest: ${{ runner.temp }}/iris-r10/pnpm-tool

      - name: Verify effective tool and cache paths
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/iris-r10"
          test "$(node --version)" = 'v24.20.0'
          test "$(pnpm --version)" = '10.15.0'
          pnpm_bin="$(command -v pnpm)"
          node - "$root" "$pnpm_bin" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = fs.realpathSync(process.argv[2]);
          const within = value => value === root || value.startsWith(root + path.sep);
          for (const name of ['HOME', 'XDG_CACHE_HOME', 'XDG_CONFIG_HOME', 'XDG_DATA_HOME', 'XDG_STATE_HOME', 'COREPACK_HOME', 'npm_config_cache', 'TMPDIR', 'PNPM_HOME', 'IRIS_R10_PNPM_STORE']) {
            const value = process.env[name];
            if (!value || !within(fs.realpathSync(value))) throw new Error(`${name} escaped runner temp`);
          }
          if (!within(fs.realpathSync(process.argv[3]))) throw new Error('Resolved pnpm executable escaped runner temp');
          NODE
          printf 'Toolchain preflight passed: Node %s, pnpm %s\n' "$(node --version)" "$(pnpm --version)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install frozen dependencies without lifecycle scripts
        id: dependencies
        shell: bash
        working-directory: .r10-event
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts --store-dir "$IRIS_R10_PNPM_STORE"
          test "$(git rev-parse 'HEAD^{commit}')" = "$TARGET_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TARGET_SOURCE_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Run R10 lifecycle recovery tests
        id: lifecycle
        shell: bash
        working-directory: .r10-event
        run: |
          set -euo pipefail
          pnpm --filter @iris/runtime exec vitest run src/lifecycle.recovery.test.ts \
            --testTimeout=480000 --reporter=json --outputFile="$IRIS_R10_EVIDENCE_DIR/r10-lifecycle-vitest.json"

      - name: Typecheck, build, lint and diff checks
        id: quality
        shell: bash
        working-directory: .r10-event
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v24.20.0'
          test "$(pnpm --version)" = '10.15.0'
          pnpm --filter @iris/runtime typecheck
          pnpm --filter @iris/runtime build
          pnpm exec eslint apps/runtime/src/lifecycle.ts apps/runtime/src/lifecycle.recovery.test.ts
          git diff --check "$DEE5_SHA" "$TARGET_SOURCE_SHA"

      - name: Preserve bounded redacted phase and cleanup diagnostics
        if: always()
        shell: bash
        env:
          R10_EVENT_SHA: ${{ github.sha }}
          R10_EVENT_REF: ${{ github.ref }}
          R10_RUNNER_OS: ${{ runner.os }}
          R10_RUNNER_ARCH: ${{ runner.arch }}
          R10_LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
          R10_QUALITY_OUTCOME: ${{ steps.quality.outcome }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const evidence = path.join(process.env.RUNNER_TEMP, 'iris-r10', 'evidence');
          fs.mkdirSync(evidence, { recursive: true });
          const issues = [];
          const lines = ['### R10 bounded redacted diagnostics', ''];
          const label = value => String(value ?? 'UNKNOWN').replace(/[^A-Za-z0-9_. /-]/g, '').slice(0, 160);
          const hash = value => /^[0-9a-f]{40}(?:[0-9a-f]{24})?$/.test(String(value ?? '')) ? value : 'UNVERIFIED';
          const detail = value => String(value ?? '').replace(/\u001b\[[0-9;]*m/g, '').split(/\r?\n/).slice(0, 4)
            .map(line => /authorization|cookie|password|secret|token|api[_ -]?key|credential/i.test(line) ? '[REDACTED_SENSITIVE_LINE]'
              : line.replace(/\b(?:https?|file):\/\/\S+/gi, '[REDACTED_URL]')
                .replace(/\b(?:gh[pousr]_|github_pat_|sk-(?:proj-)?)\S+/g, '[REDACTED_TOKEN]')
                .replace(/\b[A-Za-z0-9_-]{48,}\b/g, '[REDACTED_OPAQUE_VALUE]')
                .replace(/\/(?:Users|home|private|tmp|workspaces|workspace|var)\/[^\s"'<>]*/g, '[REDACTED_PATH]')
                .replace(/\x60/g, "'").slice(0, 240)).join('\n').slice(0, 960);
          function readReceipt(name) {
            try {
              const file = path.join(evidence, name);
              const stat = fs.lstatSync(file);
              if (!stat.isFile() || stat.isSymbolicLink() || stat.size > 1024 * 1024) throw new Error('INVALID_FILE_OR_SIZE');
              const result = JSON.parse(fs.readFileSync(file, 'utf8'));
              if (!result || typeof result !== 'object' || Array.isArray(result)) throw new Error('INVALID_JSON_OBJECT');
              return result;
            } catch (error) {
              const reason = error.code === 'ENOENT' ? 'MISSING' : 'INVALID_OR_UNREADABLE';
              issues.push(name + ':' + reason);
              lines.push(name + ': ' + reason);
              return null;
            }
          }
          const phases = Object.fromEntries(['LIFECYCLE', 'QUALITY'].map(name =>
            [name.toLowerCase(), label(process.env['R10_' + name + '_OUTCOME'] || 'NOT_REPORTED')]));
          lines.push('phase outcomes: ' + JSON.stringify(phases));
          const selected = [];
          function summarizeTests(file, expected) {
            lines.push('', '#### ' + file);
            const report = readReceipt(file);
            if (!report) return;
            const counts = Object.fromEntries(['numTotalTests', 'numPassedTests', 'numFailedTests', 'numPendingTests', 'numTodoTests']
              .map(key => [key, Number.isSafeInteger(report[key]) && report[key] >= 0 ? report[key] : null]));
            lines.push('counts: ' + JSON.stringify(counts));
            const assertions = (Array.isArray(report.testResults) ? report.testResults : []).slice(0, 50)
              .flatMap(suite => Array.isArray(suite.assertionResults) ? suite.assertionResults.slice(0, 1000) : []);
            for (const name of expected) {
              const matches = assertions.filter(assertion => assertion.title === name);
              const status = matches.length === 1 ? label(matches[0].status) : 'MISSING_OR_DUPLICATE';
              selected.push({ name, status, matchCount: matches.length });
              lines.push('assertion: ' + name + ' | status=' + status + ' | matches=' + matches.length);
              if (status !== 'passed') issues.push('SELECTED_ASSERTION_NOT_PASSED:' + name);
              for (const message of (matches.length === 1 && Array.isArray(matches[0].failureMessages) ? matches[0].failureMessages : []).slice(0, 2))
                lines.push('failure excerpt (redacted):', detail(message));
            }
          }
          summarizeTests('r10-lifecycle-vitest.json', [
            'keeps B untouched when A reaches verified health',
            'selects B only after A failure and proven cleanup',
            'records B cleanup reconciliation before surfacing cleanup failure',
            'rejects a drifted B before fallback startup',
          ]);
          const receipt = {
            workflow_sha: hash(process.env.R10_WORKFLOW_SHA || process.env.R10_EVENT_SHA),
            workflow_tree: hash(process.env.R10_WORKFLOW_TREE), workflow_parent: hash(process.env.R10_WORKFLOW_PARENT),
            tested_source_sha: hash(process.env.R10_SOURCE_SHA), tested_source_tree: hash(process.env.R10_SOURCE_TREE),
            tested_source_parent: hash(process.env.R10_SOURCE_PARENT), event_ref: label(process.env.R10_EVENT_REF),
            runner_os: label(process.env.R10_RUNNER_OS), runner_arch: label(process.env.R10_RUNNER_ARCH),
            phases: { lifecycle: phases.lifecycle, quality: phases.quality }, selected_assertions: selected, diagnostic_status: issues.length ? 'INCOMPLETE' : 'COMPLETE', diagnostic_issues: issues,
          };
          fs.writeFileSync(path.join(evidence, 'workflow-result.json'), JSON.stringify(receipt, null, 2) + '\n', { mode: 0o600 });
          const fence = String.fromCharCode(96).repeat(3);
          lines.push('', '#### Machine-readable execution receipt', fence + 'json', JSON.stringify(receipt, null, 2), fence);
          const fullOutput = lines.join('\n') + '\n';
          const truncated = Buffer.byteLength(fullOutput, 'utf8') > 32 * 1024;
          const rendered = (truncated ? Buffer.from(fullOutput).subarray(0, 32 * 1024).toString('utf8') : fullOutput)
            + '\nDIAGNOSTIC_OUTPUT_TRUNCATED=' + String(truncated) + '\n';
          if (truncated) process.exitCode = 1;
          process.stdout.write(rendered);
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, rendered);
          else { process.stderr.write('GITHUB_STEP_SUMMARY unavailable; stdout retained.\n'); issues.push('SUMMARY_UNAVAILABLE'); }
          if (issues.length || Object.values(phases).some(outcome => outcome !== 'success')) process.exitCode = 1;
          NODE

      - name: State proof limitations
        if: always()
        shell: bash
        run: |
          {
            printf '%s\n' 'This harness selects source B after source A returns failed health; no product automatic-fallback API is claimed.'
            printf '%s\n' 'The synthetic two-source proof does not establish historical RARW rollback or same-UID actor exclusion.'
            printf '%s\n' 'Private review publication does not match this workflow trigger. Hosted execution requires a separately reviewed exact source grant and a qualifying public execution-ref push.'
          } >> "$GITHUB_STEP_SUMMARY"
